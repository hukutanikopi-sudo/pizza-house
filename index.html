<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza House</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #e63946;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

.menu {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.pizza {
    background: white;
    margin-bottom: 15px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.pizza h2 {
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

button {
    background: #e63946;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 10px;
}

#orderForm {
    display: none;
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.telegram {
    background: #229ED9;
    width: 100%;
}
</style>
</head>

<body>

<header>
    <h1>🍕 Pizza House</h1>
    <p>Самая вкусная пицца рядом!</p>
</header>

<div class="menu">

    <div class="pizza">
        <h2>Пепперони</h2>
        <p>Сыр, пепперони и томатный соус.</p>
        <div class="price">2500 ₸</div>

        <button onclick="openOrder('Пепперони', 2500)">
            Заказать
        </button>
    </div>

    <div class="pizza">
        <h2>Маргарита</h2>
        <p>Томатный соус, сыр и свежие помидоры.</p>
        <div class="price">2200 ₸</div>

        <button onclick="openOrder('Маргарита', 2200)">
            Заказать
        </button>
    </div>

    <div class="pizza">
        <h2>4 сыра</h2>
        <p>Четыре вида сыра и сливочный соус.</p>
        <div class="price">2800 ₸</div>

        <button onclick="openOrder('4 сыра', 2800)">
            Заказать
        </button>
    </div>

</div>

<div id="orderForm">

    <h2>🛒 Оформление заказа</h2>

    <p id="selectedPizza"></p>

    <input
        type="text"
        id="name"
        placeholder="Ваше имя"
    >

    <input
        type="tel"
        id="phone"
        placeholder="Номер телефона"
    >

    <button class="telegram" onclick="sendOrder()">
        📋 Показать заказ
    </button>

</div>

<script>

let selectedPizza = "";
let selectedPrice = 0;

function openOrder(pizza, price) {

    selectedPizza = pizza;
    selectedPrice = price;

    document.getElementById("selectedPizza").innerText =
        "Вы выбрали: " + pizza + " — " + price + " ₸";

    document.getElementById("orderForm").style.display =
        "block";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

function sendOrder() {

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    if (name === "" || phone === "") {

        alert(
            "Пожалуйста, заполните имя и номер телефона."
        );

        return;
    }

    let message =
        "🍕 НОВЫЙ ЗАКАЗ\n\n" +
        "🍕 Пицца: " + selectedPizza + "\n" +
        "💰 Цена: " + selectedPrice + " ₸\n" +
        "👤 Имя: " + name + "\n" +
        "📞 Телефон: " + phone;

    alert(message);
}

</script>

</body>
</html>
